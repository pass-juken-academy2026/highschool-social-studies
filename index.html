let active=TRACKS[0], activeMode="people", quizItems=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function slug(s){return String(s).replace(/[^\wぁ-んァ-ヶ一-龠ー]/g,"-");}
function renderTracks(){$("tracks").innerHTML=TRACKS.map(t=>'<button class="track" data-track="'+t.id+'"><strong>'+t.icon+' '+esc(t.name)+'</strong><small>'+esc(t.desc)+'</small><span class="tag">この科目を学ぶ →</span></button>').join("");}
function chooseTrack(id){active=TRACKS.find(t=>t.id===id)||TRACKS[0];$("workspace").classList.remove("hide");$("trackTag").textContent=active.name;$("workTitle").textContent="学習メニュー";$("trackDesc").textContent=active.desc;$("stage").classList.add("hide");$("menu").classList.remove("hide");$("workspace").scrollIntoView({behavior:"smooth",block:"start"});}
function goHome(){$("workspace").classList.add("hide");$("home").scrollIntoView({behavior:"smooth",block:"start"});}
function modeName(m){return ({people:"人物・場所",laws:"法律・条約",timeline:"年表",sequence:"時代・王朝・事件順／地理正誤"})[m]||m;}
function openMode(mode){activeMode=mode;$("menu").classList.add("hide");$("stage").classList.remove("hide");let title="",body="",d=BANK[active.id];
if(mode==="people"||mode==="laws"){title=mode==="people"?"1. 人物・場所":"2. 法律・条約";body=d[mode].map(x=>'<article class="entry" id="entry-'+slug(x[0])+'"><h3>'+esc(x[0])+' <span class="tag">'+esc(x[1])+'</span></h3><p>'+esc(x[2])+'</p><p class="muted">関連：'+esc(x[3])+'</p></article>').join("");}
if(mode==="timeline"){title="3. 年表";body='<div class="timeline">'+d.timeline.map(x=>'<article class="event" id="entry-'+slug(x[1])+'"><div class="year">'+esc(x[0])+'</div><strong>'+esc(x[1])+'</strong><div>'+esc(x[2])+'</div></article>').join("")+'</div>';}
if(mode==="sequence"){title="4. 時代・王朝・事件順／地理正誤";body=d.sequence.map(x=>'<article class="entry" id="entry-'+slug(x[0])+'"><h3>'+esc(x[0])+'</h3><p>'+esc(x[1])+'</p><p class="muted">'+esc(x[2])+'</p></article>').join("");if(active.id==="geo"||active.id==="integrated")body+='<h3>地理・資料の正誤チェック</h3>'+d.tf.map(x=>'<article class="entry"><strong>'+esc(x[0])+'</strong><p>'+esc(x[1])+'</p><p class="muted">正解：'+(x[2]?"正しい":"誤り")+'。'+esc(x[3])+'</p></article>').join("");}
if(mode==="search"){title="10. 単語検索";body='<p class="muted">用語を検索して、人物・場所／法律・条約／年表／順序整理へ移動できます。</p><div class="searchrow"><input id="termSearch" type="search" placeholder="例：憲法、ガンディー、サヘル"><button id="doSearch">検索</button></div><div id="searchResults"></div>';}
if(["mcq","tf","fill","mock","common"].includes(mode)){title=({"mcq":"5. 四択問題","tf":"6. 正誤問題","fill":"7. 空欄補充","mock":"8. 模擬テスト","common":"9. 共通テスト型"})[mode];let scope="";if(active.id==="integrated")scope='<label for="rangeSelect">出題範囲：</label><select id="rangeSelect"><option value="all">3範囲を横断</option><option value="geo">地理総合</option><option value="history">歴史総合</option><option value="public">公共</option></select>';body='<p class="muted">解答後に正誤・解説・間違えた範囲を表示します。</p>'+scope+'<div id="quiz"></div><div class="toolbar"><button id="gradeQuiz">採点して弱点を確認</button><button class="secondary" id="retryQuiz">もう一度出題</button></div><div id="quizResult"></div>';}
$("stage").innerHTML='<div class="row"><h2>'+title+'</h2><button class="ghost" id="menuBack">メニューへ戻る</button></div>'+body;
$("menuBack").onclick=()=>{$("stage").classList.add("hide");$("menu").classList.remove("hide");};
if(["mcq","tf","fill","mock","common"].includes(mode)){if($("rangeSelect"))$("rangeSelect").onchange=()=>renderQuiz(mode);renderQuiz(mode);}
if(mode==="search"){const run=()=>doSearch($("termSearch").value);$("doSearch").onclick=run;$("termSearch").addEventListener("keydown",e=>{if(e.key==="Enter")run();});}}
function doSearch(term){const out=$("searchResults"),q=term.trim().toLowerCase();if(!q){out.innerHTML='<p class="notice">検索する語句を入力してください。</p>';return;}const d=BANK[active.id];let hits=[];["people","laws","timeline","sequence"].forEach(m=>d[m].forEach(x=>{if(x.join(" ").toLowerCase().includes(q))hits.push({mode:m,title:x[0],detail:x.slice(1).join(" / ")});}));hits=hits.filter((x,i,a)=>a.findIndex(y=>y.mode===x.mode&&y.title===x.title)===i);if(!hits.length){out.innerHTML='<p class="notice">見つかりませんでした。別の語句で試してください。</p>';return;}out.innerHTML='<p>検索結果：'+hits.length+'件</p>'+hits.map(h=>'<article class="entry"><h3>'+esc(h.title)+'</h3><p>'+esc(h.detail)+'</p><button class="secondary jump" data-mode="'+h.mode+'" data-title="'+esc(h.title)+'">「'+modeName(h.mode)+'」で開く</button></article>').join("");out.querySelectorAll(".jump").forEach(b=>b.onclick=()=>{openMode(b.dataset.mode);setTimeout(()=>{const el=$("stage").querySelector("#entry-"+slug(b.dataset.title));if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},20);});}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5);}
function renderQuiz(mode){let d=BANK[active.id],range=$("rangeSelect")?.value||"all",pool=[];if(mode==="mcq")pool=d.questions.slice();if(mode==="tf")pool=d.tf.slice();if(mode==="fill")pool=d.fill.slice();if(mode==="common")pool=d.common.map(x=>["資料読解",x[0],x[1],x[2],x[3],"資料読解"]);if(mode==="mock")pool=d.questions.concat(d.tf.map(x=>[x[0],x[1],["正しい","誤り"],x[2]?0:1,x[3],x[0]])).concat(d.fill.map(x=>[x[2],x[0],[x[1]],0,"正答："+x[1],x[2]]));
if(active.id==="integrated"&&range!=="all"){const keys={geo:["地理","環境"],history:["歴史","革命","独立"],public:["公共","人権","持続可能"]}[range];pool=pool.filter(q=>keys.some(k=>(q.join(" ")).includes(k)));if(!pool.length)pool=d[mode==="tf"?"tf":"questions"].slice();}
pool=shuffle(pool).slice(0,mode==="mock"?Math.min(10,pool.length):pool.length);quizItems=pool;
$("quiz").innerHTML=pool.map((q,i)=>{let type=(mode==="tf"?"tf":mode==="fill"?"fill":"mcq"),prompt=q[1],answer=q[2],explain=q[3],topic=q[0],choices="";if(type==="tf"){choices='<div class="choices"><label><input type="radio" name="q'+i+'" value="0">正しい</label><label><input type="radio" name="q'+i+'" value="1">誤り</label></div>';answer=q[2]?0:1;explain=q[3];}else if(type==="fill"){choices='<input class="fillAnswer" type="text" placeholder="答えを入力">';answer=q[1];explain=q[3];topic=q[2];}else{choices='<div class="choices">'+q[2].map((c,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'">'+esc(c)+'</label>').join("")+'</div>';answer=q[3];explain=q[4];topic=q[5]||q[0];}return '<article class="question" data-i="'+i+'" data-topic="'+esc(topic)+'" data-answer="'+esc(answer)+'" data-explain="'+esc(explain)+'" data-type="'+type+'"><div class="tag">問題 '+(i+1)+' · '+esc(topic)+'</div><p><strong>'+esc(prompt)+'</strong></p>'+choices+'<div class="result hide" id="result-'+i+'"></div></article>';}).join("");$("gradeQuiz").onclick=gradeQuiz;$("retryQuiz").onclick=()=>renderQuiz(mode);}
function gradeQuiz(){const cards=[...$("quiz").querySelectorAll(".question")];let correct=0,wrong={};cards.forEach((c,i)=>{let given,ok=false,type=c.dataset.type;if(type==="fill"){given=c.querySelector(".fillAnswer").value.trim().replace(/\s/g,"");ok=given.toLowerCase()===c.dataset.answer.replace(/\s/g,"").toLowerCase();}else{const s=c.querySelector('input[name="q'+i+'"]:checked');given=s?Number(s.value):null;ok=given!==null&&given===Number(c.dataset.answer);}const r=$("result-"+i);r.classList.remove("hide","correct","wrong");r.classList.add(ok?"correct":"wrong");r.innerHTML=(ok?"正解！":"不正解")+'<br><strong>解説：</strong>'+esc(c.dataset.explain);if(ok)correct++;else{const t=c.dataset.topic||"未分類";wrong[t]=(wrong[t]||0)+1;}});let html='<div class="panel"><h3>結果：'+correct+' / '+cards.length+' 問正解</h3><div class="statgrid"><div class="stat">正解<strong>'+correct+'</strong></div><div class="stat">不正解・未回答<strong>'+(cards.length-correct)+'</strong></div><div class="stat">正答率<strong>'+Math.round(correct/Math.max(1,cards.length)*100)+'%</strong></div></div><h3>弱点範囲</h3>';if(Object.keys(wrong).length)html+=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).map(x=>'<article class="entry"><strong>'+esc(x[0])+'</strong><p>間違い・未回答：'+x[1]+'問</p><button class="secondary review" data-term="'+esc(x[0])+'">関連語を検索</button></article>').join("");else html+='<p class="correct result">全問正解！</p>';html+='<p class="muted">弱点表示は今回の回答に基づきます。問題数が少ないため、学習の目安として使ってください。</p></div>';$("quizResult").innerHTML=html;$("quizResult").querySelectorAll(".review").forEach(b=>b.onclick=()=>{openMode("search");setTimeout(()=>{if($("termSearch")){$("termSearch").value=b.dataset.term;doSearch(b.dataset.term);}},0);});}
$("tracks").addEventListener("click",e=>{const b=e.target.closest("[data-track]");if(b)chooseTrack(b.dataset.track);});$("menu").addEventListener("click",e=>{const b=e.target.closest("[data-mode]");if(b)openMode(b.dataset.mode);});$("backHome").onclick=goHome;renderTracks();
</script></body></html>
