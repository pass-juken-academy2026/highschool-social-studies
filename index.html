<header><div class="inner"><div class="topline"><span>高校社会</span><span>6分野を選べる</span><span>学習・演習・弱点分析</span></div><h1>社会スタディラボ</h1><p>人物・場所や法律・条約から、年表、四択、正誤、空欄補充まで。選んだ分野に合わせて学習しよう。</p></div></header>
<main>
<section class="panel" id="home">
<h2 class="section-title">① 学習する分野を選ぶ</h2><p class="muted">分野を選ぶと、その分野に合った用語・年表・問題メニューに切り替わります。</p>
<div class="tracks" id="tracks"></div>
</section>
<section class="panel hide" id="workspace">
<div class="row"><div><span class="tag" id="trackTag"></span><h2 class="section-title" id="workTitle">学習メニュー</h2></div><button class="secondary" id="backHome">分野選択に戻る</button></div>
<p class="muted" id="trackDesc"></p>
<div class="menu" id="menu">
<button data-mode="people">1. 人物・場所<span>重要人物、地域、国、都市を整理</span></button>
<button data-mode="laws">2. 法律・条約<span>法律名・条約名・制度の要点</span></button>
<button data-mode="timeline">3. 年表<span>出来事を年代順に確認</span></button>
<button data-mode="sequence">4. 時代・王朝・事件順／地理正誤<span>分野ごとの順序整理・地理の正誤問題</span></button>
<button data-mode="mcq">5. 四択問題<span>解答後に正誤・解説・弱点範囲を表示</span></button>
<button data-mode="tf">6. 正誤問題<span>知識の取り違えをチェック</span></button>
<button data-mode="fill">7. 空欄補充<span>重要語句を思い出す練習</span></button>
<button data-mode="mock">8. 模擬テスト<span>複数分野をまとめて演習</span></button>
<button data-mode="common">9. 共通テスト型<span>資料・会話文を使った思考問題</span></button>
<button data-mode="search">10. 単語検索<span>法律名・人物名・地名から1〜4へ移動</span></button>
</div>
<div id="stage" class="hide"></div>
</section>
<p class="notice small">学習用の要点整理・練習問題です。入試範囲をすべて網羅するものではありません。法令・制度・統計などは、必要に応じて教科書や公的資料でも確認してください。</p>
</main>

function gradeQuiz(){let cards=[...$("quiz").querySelectorAll(".question")],correct=0,wrong={};cards.forEach((c,i)=>{const type=c.dataset.type;let given,ok=false;if(type==="fill"){given=c.querySelector(".fillAnswer").value.trim().replace(/\s/g,"");const ans=c.dataset.answer.replace(/\s/g,"");ok=given.toLowerCase()===ans.toLowerCase();}else{const sel=c.querySelector('input[name="q'+i+'"]:checked');given=sel?Number(sel.value):null;ok=given!==null&&given===Number(c.dataset.answer);}const r=$("result-"+i);r.classList.remove("hide","correct","wrong");r.classList.add(ok?"correct":"wrong");r.innerHTML=(ok?"正解！":"不正解")+'<br><strong>解説：</strong>'+esc(c.dataset.explain);if(ok)correct++;else{const t=c.dataset.topic||"分野未分類";wrong[t]=(wrong[t]||0)+1;}});let html='<div class="panel"><h3>結果：'+correct+' / '+cards.length+' 問正解</h3><div class="statgrid"><div class="stat"><span class="muted">正解</span><strong>'+correct+'</strong></div><div class="stat"><span class="muted">不正解・未回答</span><strong>'+(cards.length-correct)+'</strong></div><div class="stat"><span class="muted">正答率</span><strong>'+Math.round(correct/cards.length*100)+'%</strong></div></div><h3>弱点範囲</h3>';if(Object.keys(wrong).length){html+='<p>間違えた問題のタグを、復習優先度の高い順に表示しています。</p>'+Object.entries(wrong).sort((a,b)=>b[1]-a[1]).map(x=>'<article class="entry"><strong>'+esc(x[0])+'</strong><p>間違い・未回答：'+x[1]+'問</p><button class="secondary reviewSearch" data-term="'+esc(x[0])+'">関連語を検索して復習</button></article>').join("");}else html+='<p class="correct result">全問正解！今回の出題範囲はよく理解できています。</p>';html+='<p class="muted small">弱点は今回の回答から算出しています。問題数が少ない場合は、追加で解いて傾向を確認してください。</p></div>';$("quizResult").innerHTML=html;$("quizResult").querySelectorAll(".reviewSearch").forEach(b=>b.onclick=()=>{openMode("search");setTimeout(()=>{if($("termSearch")){$("termSearch").value=b.dataset.term;doSearch(b.dataset.term);}},0);});$("quizResult").scrollIntoView({behavior:"smooth",block:"start"});}
