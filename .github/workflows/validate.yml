name: Validate static site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML and inline JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, sys, tempfile
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.scripts=[]; self.active=False; self.buf=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if 'id' in a: self.ids.append(a['id'])
                  if tag=='script': self.active=True; self.buf=[]
              def handle_data(self, data):
                  if self.active: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.active: self.scripts.append(''.join(self.buf)); self.active=False
          files=list(Path('.').rglob('*.html')); failed=False
          if not files: sys.exit('No HTML files found')
          for f in files:
              a=Audit(); a.feed(f.read_text(encoding='utf-8'))
              dup=sorted({i for i in a.ids if a.ids.count(i)>1})
              if dup: print(f'Duplicate IDs in {f}: {dup}'); failed=True
              for n,js in enumerate(a.scripts):
                  if not js.strip(): continue
                  p=Path(tempfile.gettempdir())/f'inline-{abs(hash((str(f),n)))}.js'; p.write_text(js,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode: print(f'JS syntax error in {f}, script {n+1}:\n{r.stderr}'); failed=True
              print(f'Checked {f}: {len(a.scripts)} scripts')
          if failed: sys.exit(1)
          PY

      - name: Check Stage 2 social studies coverage and answer data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          source = Path('practice.html').read_text(encoding='utf-8')
          required = [
              '【時代の流れ】', '【因果関係】', '【資料読解】',
              '【地図読解】', '【統計・グラフ】', '【公共用語】',
              '【制度・思想比較】', '【事例問題】',
          ]
          missing = [x for x in required if x not in source]
          record_re = re.compile(r'\["([^"]*)",\[([^\]]*)\],(\d+),"([^"]*)"\]')
          records = record_re.findall(source)
          for n, (_, raw_choices, raw_answer, explanation) in enumerate(records, 1):
              choices = re.findall(r'"([^"]*)"', raw_choices)
              if len(choices) < 2 or int(raw_answer) >= len(choices) or not explanation.strip():
                  missing.append(f'invalid answer data in question {n}')
          if len(records) < 18:
              missing.append(f'expected at least 18 question records, found {len(records)}')
          if missing:
              print('Stage 2 social studies validation errors:')
              print('\n'.join(missing))
              sys.exit(1)
          print(f'Stage 2 social studies coverage OK; validated {len(records)} question records')
          PY

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright package
        run: npm install --no-save playwright
        timeout-minutes: 5
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
        timeout-minutes: 5
      - name: Install Chromium browser
        run: npx playwright install chromium
        timeout-minutes: 5
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/study-site.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/study-site.log
          exit 1
      - name: Exercise core study flows in Chromium
        run: node tests/browser-smoke.cjs
