const COMMON_STIMULI=[{"title":"【資料A】地域Aの年齢構成（学習用の模式データ）","text":"地域Aの人口を年齢層別に整理した。人口の単位は千人。","table":"<table><tr><th>年齢層</th><th>人口（千人）</th></tr><tr><td>0〜14歳</td><td>12</td></tr><tr><td>15〜64歳</td><td>58</td></tr><tr><td>65歳以上</td><td>30</td></tr><tr><th>合計</th><th>100</th></tr></table>"},{"title":"【資料B】市民アンケート（学習用の模式データ）","text":"200人が、地域で優先してほしい政策を1つ選んだ。回答者は市民全体を無作為に代表するとは限らない。","table":"<table><tr><th>政策分野</th><th>回答数</th></tr><tr><td>教育</td><td>80</td></tr><tr><td>公共交通</td><td>60</td></tr><tr><td>環境</td><td>40</td></tr><tr><td>福祉</td><td>20</td></tr><tr><th>合計</th><th>200</th></tr></table>"},{"title":"【資料C】市の予算配分（学習用の模式データ）","text":"ある市の当初予算100億円を、4分野に配分した。","table":"<table><tr><th>分野</th><th>予算（億円）</th></tr><tr><td>福祉</td><td>45</td></tr><tr><td>教育</td><td>25</td></tr><tr><td>道路・公共施設</td><td>20</td></tr><tr><td>その他</td><td>10</td></tr><tr><th>合計</th><th>100</th></tr></table>"},{"title":"【資料D】工業地域の変化を示す年表と手紙（学習用の架空資料）","text":"年表：1900年 工場が設立、1910年 鉄道が開通、1920年 都市人口が増加、1930年 工場周辺に住宅地が拡大。1915年の工場経営者の手紙には、鉄道で製品を運びやすくなった一方、通勤時間が長くなったと話す労働者もいると記されている。手紙は一人の立場から書かれた資料である。","table":"<p>資料を読むときは、作成時期・書き手の立場・記述の根拠を分けて考える。</p>"}];const COMMON_TEST=[["資料Aで、65歳以上の人口が総人口に占める割合は？",["12%","30%","58%","70%"],1,"30÷100×100＝30%。",0],["資料Aから確実に読み取れることは？",["65歳以上が最も多い","15〜64歳が人口の過半数を占める","翌年も人口が必ず増える","出生率が上昇している"],1,"58千人は100千人の過半数である。将来の増減や出生率はこの資料だけでは分からない。",0],["資料Aだけでは判断できないことは？",["0〜14歳の人口","人口の合計","将来の人口推移","65歳以上の人口割合"],2,"1時点の年齢構成だけでは、将来の人口推移は断定できない。",0],["資料Aの年齢構成を踏まえた政策を考えるとき、追加で確認するのが適切なのは？",["年齢層別の将来推計やサービス需要","地域の地名の由来だけ","人口とは無関係な商品の色","資料の文字の大きさだけ"],0,"政策判断には将来推計や住民の需要など、追加の根拠が必要。",0],["資料Aで、0〜14歳と65歳以上を合わせた人口は総人口の何％か？",["30%","42%","58%","70%"],1,"12＋30＝42千人。総人口100千人なので42％。",0],["資料Bで、教育を選んだ人の割合は？",["20%","30%","40%","80%"],2,"80÷200×100＝40%。",1],["資料Bで、回答数が2番目に多い政策分野は？",["教育","公共交通","環境","福祉"],1,"教育80人に次いで公共交通が60人。",1],["資料Bから直接言えることは？",["市民全員の40%が教育を最優先する","回答者の40%が教育を選んだ","教育予算が最大である","公共交通の利用者が60人である"],1,"示されているのはアンケート回答者の選択であり、市民全体の意見や実際の利用者数とは限らない。",1],["資料Bを政策決定に使う際の注意点として適切なのは？",["回答者の属性や調査方法も確認する","回答者200人の意見を全住民の意見とみなす","選択肢の数だけで政策効果を決める","未回答者の意見も同じだと仮定する"],0,"標本の偏りや調査方法を確認し、結果の一般化が妥当か考える。",1],["資料Bで、公共交通を選んだ回答者の割合は？",["20%","30%","40%","60%"],1,"60÷200×100＝30％。",1],["資料Cで、教育と道路・公共施設の予算を合わせるといくら？",["20億円","25億円","45億円","55億円"],2,"25＋20＝45億円。",2],["資料Cで、福祉予算が総予算に占める割合は？",["10%","20%","25%","45%"],3,"総予算100億円のうち45億円なので45%。",2],["資料Cから読み取れることとして適切なのは？",["福祉の配分額が4分野で最大","その他の配分額が最大","予算は合計1000億円","教育予算は福祉予算より大きい"],0,"福祉45億円が最大である。",2],["資料Cだけでは断定できないことは？",["福祉予算の金額","教育予算の金額","予算配分が住民の満足度を必ず高めること","4分野の合計額"],2,"予算配分だけでは政策の効果や住民満足度までは分からない。",2],["資料Cで、その他の分野の予算が総予算に占める割合は？",["10%","20%","25%","45%"],0,"10億円÷100億円×100＝10％。",2],["資料Dの年表で、最も早く起きた出来事は？",["工場の設立","鉄道の開通","都市人口の増加","住宅地の拡大"],0,"工場の設立は1900年で、年表中の最も早い出来事。",3],["資料Dの手紙から読み取れることとして適切なのは？",["全ての労働者が鉄道を歓迎した","経営者は輸送の改善を評価し、通勤に不便を感じる労働者もいた","鉄道開通で工場が必ず閉鎖した","手紙だけで都市人口の正確な数が分かる"],1,"手紙には経営者の見方と、一部の労働者の通勤上の不便が記されている。",3],["労働者の生活への影響をさらに調べる資料として適切なのは？",["当時の賃金・労働時間・通勤時間の記録","工場の看板の色だけ","現代の別地域の人口だけ","手紙の文字数だけ"],0,"賃金や労働時間、通勤時間などがあれば、生活への影響を具体的に検討できる。",3],["異なる立場の資料を比較する目的として最も適切なのは？",["一つの資料だけを絶対に正しいと決める","資料の作成時期を無視する","立場による見方の違いと共通点を確かめる","一致しない記述をすべて削除する"],2,"複数の立場の資料を比較すると、共通点や見方の違いを検討できる。",3],["この手紙だけで「全ての労働者の生活が改善した」と結論できるか？",["必ずできる","工場経営者の手紙なので必ずできる","年表があるので必ずできる","一人の手紙だけでは全労働者について断定できない"],3,"一つの手紙は限られた立場からの資料であり、全労働者に一般化するには追加資料が必要。",3]];let commonExamTimerId=null,commonExamSeconds=3600;
function stopCommonExamTimer(){if(commonExamTimerId){clearInterval(commonExamTimerId);commonExamTimerId=null;}}
function startCommonExamTimer(){stopCommonExamTimer();commonExamSeconds=3600;let label=$("commonExamTimer");if(!label){label=document.createElement("p");label.id="commonExamTimer";label.style.cssText="margin:8px 0;padding:8px 12px;border:1px solid #94a3b8;border-radius:8px;font-weight:700";$("quiz").insertBefore(label,$("quiz").firstChild);}const tick=()=>{const m=Math.floor(commonExamSeconds/60),s=commonExamSeconds%60;label.textContent="共通テスト型・残り時間 "+m+":"+String(s).padStart(2,"0");if(commonExamSeconds<=0){stopCommonExamTimer();finish();return;}commonExamSeconds--;};tick();commonExamTimerId=setInterval(tick,1000);}
function start(list=null,review=false){stopCommonExamTimer();const mode=$("mode").value;let source=list||BANK;if(!list&&mode==="basic")source=BANK.slice(0,6);if(!list&&mode==="common")source=COMMON_TEST;if(!list&&mode==="mock")source=[...BANK];questions=(!list&&mode==="common")?[...source]:[...source].sort(()=>Math.random()-.5);if(!list&&mode==="mock")questions=questions.slice(0,1);if(!questions.length)questions=[...BANK];idx=0;answers=[];locked=false;reviewOnly=review;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");$("pdfExportControls").classList.remove("hidden");render();if(!list&&mode==="common")startCommonExamTimer()}
function render(){const q=questions[idx];locked=false;$("counter").textContent=(idx+1)+" / "+questions.length;$("scoreLive").textContent="回答済み "+answers.filter(a=>a&&a.selected!==undefined).length+"問";$("bar").style.width=(idx/questions.length*100)+"%";const qel=$("question");let st=$("commonStimulus");if(!st){st=document.createElement("section");st.id="commonStimulus";st.className="panel";qel.parentNode.insertBefore(st,qel);}const cm=$("mode").value==="common";st.style.display=cm?"block":"none";const stimulus=COMMON_STIMULI[q[4]??0]||COMMON_STIMULI[0];st.innerHTML=cm?"<h3>"+stimulus.title+"</h3><p>"+stimulus.text+"</p>"+stimulus.table:"";$("question").textContent=q[0];$("choices").innerHTML="";q[1].forEach((t,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=["A","B","C","D"][i]+"．"+t;b.addEventListener("click",()=>{if(locked)return;answers[idx]={selected:i};[...$("choices").children].forEach(x=>x.classList.remove("selected"));b.classList.add("selected")});$("choices").appendChild(b)});$("feedback").classList.add("hidden");$("feedback").textContent="";$("check").disabled=false;$("next").disabled=true;$("next").textContent=idx===questions.length-1?"結果を見る":"次の問題 →"}
$("start").addEventListener("click",()=>start());
$("check").addEventListener("click",()=>{if(locked)return;if(!answers[idx]||answers[idx].selected===undefined){$("feedback").textContent="選択肢を選んでね。";$("feedback").classList.remove("hidden");return}locked=true;const q=questions[idx],a=answers[idx];a.correct=a.selected===q[2];[...$("choices").children].forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct");if(i===a.selected&&i!==q[2])b.classList.add("wrong")});$("feedback").textContent=(a.correct?"正解！":"不正解。正解は "+["A","B","C","D"][q[2]]+"。")+" "+q[3];$("feedback").classList.remove("hidden");$("check").disabled=true;$("next").disabled=false;$("scoreLive").textContent="現在 "+answers.filter(x=>x&&x.correct).length+"問正解"});
$("next").addEventListener("click",()=>{if(idx<questions.length-1){idx++;render()}else finish()});
function finish(){stopCommonExamTimer(); $("quiz").classList.add("hidden");$("result").classList.remove("hidden");const good=answers.filter(a=>a&&a.correct).length;const wrong=questions.map((q,i)=>({q,a:answers[i]})).filter(x=>!x.a||!x.a.correct);$("summary").textContent=good+" / "+questions.length+"問正解（正答率 "+Math.round(good/questions.length*100)+"%）";$("analysis").textContent=good===questions.length?"全問正解！知識だけでなく、根拠を説明できるかも確認しよう。":wrong.length+"問を復習リストに入れました。解説を読み、なぜその選択肢が正しいかを自分の言葉で説明してみよう。";$("missed").innerHTML=wrong.length?wrong.map(x=>'<div class="explain" style="margin:10px 0"><strong>'+x.q[0]+'</strong><p>正解：'+x.q[1][x.q[2]]+'</p><p>'+x.q[3]+'</p></div>').join(""):"間違えた問題はありません。";$("review").disabled=!wrong.length;$("review").onclick=()=>start(wrong.map(x=>x.q),true);$("again").onclick=()=>start()}
/* practice-query-autostart */const qp=new URLSearchParams(window.location.search);const requestedMode=qp.get("mode");if(["common","mock","basic"].includes(requestedMode)){$("mode").value=requestedMode;}if(qp.get("autostart")==="1"){start();}
function pdfEscape(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function pdfStimulusFor(q,mode){if(mode!=="common")return null;const n=Number(q[4]??0);return COMMON_STIMULI[Math.max(0,Math.min(COMMON_STIMULI.length-1,n))]||COMMON_STIMULI[0]||null;}
function exportPracticePdf(kind){
 if(!Array.isArray(questions)||!questions.length){alert("先に演習を開始してください。");return;}
 const mode=$("mode").value,title=document.querySelector("h1")?.textContent||"演習",stamp=new Date().toLocaleDateString("ja-JP");
 let body="",lastStimulus="";
 const renderStimulus=q=>{const st=pdfStimulusFor(q,mode);if(!st)return "";const key=mode+":"+String(q[4]??"shared");if(key===lastStimulus)return "";lastStimulus=key;return '<section class="stimulus"><h2>'+pdfEscape(st.title||"資料")+'</h2><p>'+pdfEscape(st.text||"")+'</p><div>'+String(st.table||"")+'</div></section>';};
 const qhtml=(q,i)=>'<article class="question"><h3>問題 '+(i+1)+'</h3><p class="prompt">'+pdfEscape(q[0])+'</p><ol type="A">'+(Array.isArray(q[1])?q[1]:[]).map(v=>'<li>'+pdfEscape(v)+'</li>').join("")+'</ol></article>';
 const ahtml=(q,i)=>'<article class="answer"><h3>問題 '+(i+1)+'</h3><p><strong>'+pdfEscape(q[0])+'</strong></p><p><strong>正解：</strong>'+pdfEscape((q[1]||[])[q[2]]??"未設定")+'</p><p><strong>解説：</strong>'+pdfEscape(q[3]||"解説未設定")+'</p></article>';
 if(kind!=="answers"){body+='<h1>問題</h1><p class="meta">'+pdfEscape(title)+' · '+stamp+' · '+questions.length+'問</p>';questions.forEach((q,i)=>{body+=renderStimulus(q)+qhtml(q,i);});}
 if(kind==="answers"){body+='<h1>解答・解説</h1><p class="meta">'+pdfEscape(title)+' · '+stamp+' · '+questions.length+'問</p>';questions.forEach((q,i)=>{body+=ahtml(q,i);});}
 if(kind==="combined"){body+='<section class="answer-key"><h1>解答・解説</h1><p class="meta">問題編の後に解答を掲載</p>';questions.forEach((q,i)=>{body+=ahtml(q,i);});body+='</section>';}
 const win=window.open("","_blank");if(!win){alert("印刷用ウィンドウが開けません。ポップアップを許可して再試行してください。");return;}
 win.document.open();win.document.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+pdfEscape(title)+' PDF</title><style>body{font:12pt/1.65 system-ui,-apple-system,sans-serif;color:#111;margin:18mm}h1{font-size:20pt;border-bottom:2px solid #333;padding-bottom:4mm}h2{font-size:15pt}h3{font-size:12pt;margin:0 0 3mm}.meta{color:#555;font-size:10pt}.stimulus{border:1px solid #999;padding:5mm;margin:7mm 0;break-inside:avoid}.stimulus table{border-collapse:collapse;width:100%;margin:4mm 0}.stimulus th,.stimulus td{border:1px solid #777;padding:2mm;text-align:left}.question,.answer{margin:5mm 0;padding:4mm 0;border-bottom:1px solid #bbb;break-inside:avoid}.prompt{white-space:pre-wrap}.answer-key{break-before:page}@page{size:A4;margin:14mm}</style></head><body>'+body+'<script>window.addEventListener("load",()=>setTimeout(()=>window.print(),250));<\/script></body></html>');win.document.close();
}
$("pdfQuestions").addEventListener("click",()=>exportPracticePdf("questions"));
$("pdfAnswers").addEventListener("click",()=>exportPracticePdf("answers"));
$("pdfCombined").addEventListener("click",()=>exportPracticePdf("combined"));
</script></body></html>
